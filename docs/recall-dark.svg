<text x="730" y="90" font-size="11.5" fill="#9198a1" text-anchor="start">then one hop: each result's own</text>
<text x="730" y="106" font-size="11.5" fill="#9198a1" text-anchor="start">[[links]] come along, nothing further</text>
<text x="730" y="140" font-size="11.5" fill="#9198a1" text-anchor="start">beside score, sim: the cosine from the</text>
<text x="730" y="156" font-size="11.5" fill="#9198a1" text-anchor="start">vector leg, so the hook can abstain</text>
<text x="730" y="190" font-size="11.5" fill="#9198a1" text-anchor="start">a flagged row still comes, with its</text>
<text x="730" y="206" font-size="11.5" fill="#9198a1" text-anchor="start">verdict, votes and reason beside it</text>
<text x="20" y="310" font-size="11.5" fill="#9198a1" text-anchor="start">real arithmetic, fictional store: rank 1 on both legs is 1/61 twice; rank 2 on one leg is 1/62. Nothing cleverer is in this repo.</text>
</svg>
