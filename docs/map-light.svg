<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="614" viewBox="0 0 1100 614" role="img" aria-label="Every piece, on one map: sessions write files to one store; the hub ingests them into a graph and serves recall back; the Verifier checks every reference against read-only clones, the Gardener opens a branch, the review lane merges or holds, and the merged file comes back through ingest.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8250df"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker></defs>
<rect x="20" y="20" width="320" height="400" rx="12" fill="none" stroke="#d0d7de" stroke-dasharray="5 5"/>
<text x="34" y="40" font-size="11" font-weight="600" fill="#1f2328" letter-spacing="1">THE SESSIONS · where memories are written</text>
<rect x="370" y="20" width="370" height="500" rx="12" fill="none" stroke="#d0d7de" stroke-dasharray="5 5"/>
<text x="384" y="40" font-size="11" font-weight="600" fill="#1f2328" letter-spacing="1">THE HUB · always on</text>
<rect x="770" y="20" width="310" height="500" rx="12" fill="none" stroke="#d0d7de" stroke-dasharray="5 5"/>
<text x="784" y="40" font-size="11" font-weight="600" fill="#1f2328" letter-spacing="1">THE AUDIT · the truth loop</text>
<rect x="40" y="56" width="280" height="104" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="54" y="78" class="m" font-size="13.5" font-weight="600" fill="#8250df">a session, any machine</text>
<text x="54" y="96" font-size="12" fill="#59636e">writes one markdown file per memory</text>
<text x="54" y="112" font-size="12" fill="#59636e">a hook at every prompt: recall N</text>
<text x="54" y="128" font-size="12" fill="#59636e">(slugs + descriptions, never bodies)</text>
<text x="54" y="144" font-size="12" fill="#59636e">pulls the store at start, pushes at stop</text>
<rect x="40" y="190" width="280" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="54" y="212" class="m" font-size="13.5" font-weight="600" fill="#8250df">MEMORY.md</text>
<text x="54" y="230" font-size="12" fill="#59636e">one pointer per memory, loaded whole</text>
<text x="54" y="246" font-size="12" fill="#59636e">no state stamps: state comes from probes</text>
<rect x="40" y="300" width="280" height="88" rx="10" fill="#fff8c5" stroke="#9a6700"/>
<text x="54" y="322" class="m" font-size="13.5" font-weight="600" fill="#9a6700">excluded types</text>
<text x="54" y="340" font-size="12" fill="#59636e">any type can be kept out of recall:</text>
<text x="54" y="356" font-size="12" fill="#59636e">exclude_types is the graph's own parameter,</text>
<text x="54" y="372" font-size="12" fill="#59636e">applied on every path (hook, CLI, API)</text>
<rect x="390" y="56" width="330" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="404" y="78" class="m" font-size="13.5" font-weight="600" fill="#8250df">the store · one git repo</text>
<text x="404" y="96" font-size="12" fill="#59636e">source of truth: files + the index</text>
<text x="404" y="112" font-size="12" fill="#59636e">the database is derived and rebuildable</text>
<rect x="390" y="170" width="330" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="404" y="192" class="m" font-size="13.5" font-weight="600" fill="#8250df">the graph · ingest.py</text>
<text x="404" y="210" font-size="12" fill="#59636e">Postgres + pgvector: nodes, links, vectors</text>
<text x="404" y="226" font-size="12" fill="#59636e">an edited memory loses its embedding</text>
<text x="404" y="242" font-size="12" fill="#59636e">a deleted file is archived, never deleted</text>
<rect x="390" y="292" width="330" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="404" y="314" class="m" font-size="13.5" font-weight="600" fill="#8250df">recall.py · token-gated HTTP</text>
<text x="404" y="332" font-size="12" fill="#59636e">keyword + vector, reciprocal rank fusion</text>
<text x="404" y="348" font-size="12" fill="#59636e">one hop of links, nothing cleverer</text>
<text x="404" y="364" font-size="12" fill="#59636e">a flagged memory arrives with its verdict</text>
<rect x="390" y="414" width="330" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="404" y="436" class="m" font-size="13.5" font-weight="600" fill="#8250df">the night · one cron</text>
<text x="404" y="454" font-size="12" fill="#59636e">lint → ingest → embed → verify</text>
<text x="404" y="470" font-size="12" fill="#59636e">→ gardener → review → a machine-written</text>
<text x="404" y="486" font-size="12" fill="#59636e">STATE, trusted over any doc</text>
<rect x="790" y="56" width="270" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="804" y="78" class="m" font-size="13.5" font-weight="600" fill="#8250df">evidence scopes</text>
<text x="804" y="96" font-size="12" fill="#59636e">read-only clones of the repos a memory</text>
<text x="804" y="112" font-size="12" fill="#59636e">cites; project: crumbledger → that one</text>
<rect x="790" y="162" width="270" height="104" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
<text x="804" y="184" class="m" font-size="13.5" font-weight="600" fill="#1a7f37">verify.py · report-only</text>
<text x="804" y="202" font-size="12" fill="#59636e">every reference, checked in its own scope,</text>
<text x="804" y="218" font-size="12" fill="#59636e">pinned to a blob hash</text>
<text x="804" y="234" font-size="12" fill="#59636e">missing ≠ moved ≠ changed ≠ elsewhere</text>
<text x="804" y="250" font-size="12" fill="#59636e">a model judge on drift, 2 of 3 to flag</text>
<rect x="790" y="300" width="270" height="88" rx="10" fill="#ffebe9" stroke="#cf222e"/>
<text x="804" y="322" class="m" font-size="13.5" font-weight="600" fill="#cf222e">gardener.py</text>
<text x="804" y="340" font-size="12" fill="#59636e">a flagged memory → one branch with the</text>
<text x="804" y="356" font-size="12" fill="#59636e">minimal dated correction, never a delete</text>
<text x="804" y="372" font-size="12" fill="#59636e">a rejected branch parks it 30 days</text>
<rect x="790" y="422" width="270" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="804" y="444" class="m" font-size="13.5" font-weight="600" fill="#8250df">review.py · the review lane</text>
<text x="804" y="462" font-size="12" fill="#59636e">a code guard, then a cold model read</text>
<text x="804" y="478" font-size="12" fill="#59636e">identity, the index, the human's name:</text>
<text x="804" y="494" font-size="12" fill="#59636e">always held for the human</text>
<path d="M322 90 L388 90" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a)"/>
<text x="355" y="80" font-size="11" fill="#8250df" text-anchor="middle">push · pull</text>
<path d="M555 138 L555 168" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a)"/>
<text x="563" y="158" font-size="11" fill="#8250df" text-anchor="start">nightly re-ingest</text>
<path d="M555 260 L555 290" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M555 382 L555 412" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a)"/>
<text x="563" y="402" font-size="11" fill="#8250df" text-anchor="start">runs the chain</text>
<path d="M388 336 L332 336 L332 162" fill="none" stroke="#8250df" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="44" y="286" font-size="11" fill="#8250df" text-anchor="start">↑ top-N into the prompt</text>
<path d="M722 214 L788 214" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a)"/>
<text x="755" y="206" font-size="11" fill="#8250df" text-anchor="middle">nodes + refs</text>
<path d="M925 130 L925 160" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a)"/>
<text x="933" y="150" font-size="11" fill="#8250df" text-anchor="start">live code</text>
<path d="M722 458 L768 458" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a)"/>
<text x="745" y="450" font-size="11" fill="#8250df" text-anchor="middle">runs the audit</text>
<path d="M925 268 L925 298" fill="none" stroke="#cf222e" stroke-width="1.6" marker-end="url(#r)"/>
<text x="933" y="288" font-size="11" fill="#cf222e" text-anchor="start">STALE · CONTRADICTED</text>
<path d="M925 390 L925 420" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a)"/>
<text x="933" y="410" font-size="11" fill="#8250df" text-anchor="start">a branch</text>
<path d="M1062 462 L1072 462 L1072 528 L360 528 L360 120 L388 120" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#g)"/>
<text x="716" y="542" font-size="11" fill="#1a7f37" text-anchor="middle">a merge → the file changes → back through ingest</text>
<text x="30" y="562" font-size="11.5" fill="#59636e" text-anchor="start">the example store: flour-reorder-point.md cites src/reorder.py in crumbledger.</text>
<text x="30" y="580" font-size="11.5" fill="#59636e" text-anchor="start">Night forty the reference moves: tier 1 re-anchors it and reports it as moved, under its own</text>
<text x="30" y="598" font-size="11.5" fill="#59636e" text-anchor="start">heading. Not judged, not counted as ok. Nothing here edits a memory but a merged branch.</text>
</svg>
